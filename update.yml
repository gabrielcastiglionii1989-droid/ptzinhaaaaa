name: Atualizar XP
on:
  schedule:
    - cron: "30 10 * * *"   # todo dia 10:30 UTC (depois do server save)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
      - name: Salvar dados
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Atualiza XP $(date -u +%F)" && git push)
